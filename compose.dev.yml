services:
  postgres:
    image: postgres:18.4
    container_name: travel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: travel
      POSTGRES_USER: travel
      POSTGRES_PASSWORD: travel_dev_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - travel-postgres-data:/var/lib/postgresql
      - ./scripts/init-test-database.sql:/docker-entrypoint-initdb.d/10-init-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel -d travel"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  travel-postgres-data:
