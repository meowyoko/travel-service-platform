<path d="M 170.0 448.0 C 170.0 556.5, 441.0 556.5, 441.0 665.0" fill="none" stroke="#7c4f3f" stroke-width="3.5" marker-end="url(#arrow)" stroke-linecap="round"/>
<g transform="translate(284.5,530.5)"><rect width="42" height="32" rx="16" fill="#ffffff" stroke="#d5c3b5" stroke-width="1.5"/><text x="21.0" y="21" text-anchor="middle" font-size="15" font-family="Microsoft YaHei UI, Noto Sans SC, sans-serif" fill="#7c4f3f" font-weight="700">有</text></g>
<path d="M 441.0 775.0 C 441.0 885.5, 186.0 885.5, 186.0 996.0" fill="none" stroke="#7c4f3f" stroke-width="3.5" marker-end="url(#arrow)" stroke-linecap="round"/>
<g transform="translate(283.5,859.5)"><rect width="60" height="32" rx="16" fill="#ffffff" stroke="#d5c3b5" stroke-width="1.5"/><text x="30.0" y="21" text-anchor="middle" font-size="15" font-family="Microsoft YaHei UI, Noto Sans SC, sans-serif" fill="#7c4f3f" font-weight="700">满了</text></g>
<path d="M 441.0 775.0 C 441.0 880.0, 473.0 880.0, 473.0 985.0" fill="none" stroke="#7c4f3f" stroke-width="3.5" marker-end="url(#arrow)" stroke-linecap="round"/>
<g transform="translate(427.0,854.0)"><rect width="60" height="32" rx="16" fill="#ffffff" stroke="#d5c3b5" stroke-width="1.5"/><text x="30.0" y="21" text-anchor="middle" font-size="15" font-family="Microsoft YaHei UI, Noto Sans SC, sans-serif" fill="#7c4f3f" font-weight="700">没满</text></g>
<path d="M 473.0 1095.0 C 473.0 1206.5, 170.0 1206.5, 170.0 1318.0" fill="none" stroke="#7c4f3f" stroke-width="3.5" marker-end="url(#arrow)" stroke-linecap="round"/>
<g transform="translate(291.5,1180.5)"><rect width="60" height="32" rx="16" fill="#ffffff" stroke="#d5c3b5" stroke-width="1.5"/><text x="30.0" y="21" text-anchor="middle" font-size="15" font-family="Microsoft YaHei UI, Noto Sans SC, sans-serif" fill="#7c4f3f" font-weight="700">不在</text></g>
<path d="M 473.0 1095.0 C 473.0 1206.5, 414.0 1206.5, 414.0 1318.0" fill="none" stroke="#7c4f3f" stroke-width="3.5" marker-end="url(#arrow)" stroke-linecap="round"/>
<g transform="translate(422.5,1180.5)"><rect width="42" height="32" rx="16" fill="#ffffff" stroke="#d5c3b5" stroke-width="1.5"/><text x="21.0" y="21" text-anchor="middle" font-size="15" font-family="Microsoft YaHei UI, Noto Sans SC, sans-serif" fill="#7c4f3f" font-weight="700">在</text></g>
<rect x="80.0" y="38.0" width="196" height="84" rx="22" fill="url(#cardFill)" stroke="#d7c4b2" stroke-width="2" filter="url(#softShadow)"/>
<text x="178.0" y="80" text-anchor="middle" dominant-baseline="middle" font-size="18" font-family="Microsoft YaHei UI, Noto Sans SC, sans-serif" fill="#253143" font-weight="600">员工准备提交意向</text>
<polygon points="170.0,352.0 260.0,400 170.0,448.0 80.0,400" fill="url(#diamondFill)" stroke="#b67a66" stroke-width="2.5" filter="url(#softShadow)"/>
<text x="170.0" y="400" text-anchor="middle" dominant-baseline="middle" font-size="18" font-family="Microsoft YaHei UI, Noto Sans SC, sans-serif" fill="#253143" font-weight="600">还有额度吗</text>
<rect x="80.0" y="678.0" width="180" height="84" rx="22" fill="url(#cardFill)" stroke="#d7c4b2" stroke-width="2" filter="url(#softShadow)"/>
<text x="170.0" y="720" text-anchor="middle" dominant-baseline="middle" font-size="18" font-family="Microsoft YaHei UI, Noto Sans SC, sans-serif" fill="#253143" font-weight="600">不能提交</text>
<polygon points="441.0,665.0 558.0,720 441.0,775.0 324.0,720" fill="url(#diamondFill)" stroke="#b67a66" stroke-width="2.5" filter="url(#softShadow)"/>
<text x="441.0" y="708" text-anchor="middle" dominant-baseline="middle" font-size="18" font-family="Microsoft YaHei UI, Noto Sans SC, sans-serif" fill="#253143" font-weight="600">待处理的意向是不</text>
<text x="441.0" y="732" text-anchor="middle" dominant-baseline="middle" font-size="18" font-family="Microsoft YaHei UI, Noto Sans SC, sans-serif" fill="#253143" font-weight="600">是已经满了</text>
<rect x="80.0" y="996.0" width="212" height="88" rx="22" fill="url(#cardFill)" stroke="#d7c4b2" stroke-width="2" filter="url(#softShadow)"/>
<text x="186.0" y="1028" text-anchor="middle" dominant-baseline="middle" font-size="18" font-family="Microsoft YaHei UI, Noto Sans SC, sans-serif" fill="#253143" font-weight="600">需要先等现有意向处理</text>
<text x="186.0" y="1052" text-anchor="middle" dominant-baseline="middle" font-size="18" font-family="Microsoft YaHei UI, Noto Sans SC, sans-serif" fill="#253143" font-weight="600">完，或撤销一个</text>
<polygon points="473.0,985.0 590.0,1040 473.0,1095.0 356.0,1040" fill="url(#diamondFill)" stroke="#b67a66" stroke-width="2.5" filter="url(#softShadow)"/>
<text x="473.0" y="1028" text-anchor="middle" dominant-baseline="middle" font-size="18" font-family="Microsoft YaHei UI, Noto Sans SC, sans-serif" fill="#253143" font-weight="600">出行时间在方案的</text>
<text x="473.0" y="1052" text-anchor="middle" dominant-baseline="middle" font-size="18" font-family="Microsoft YaHei UI, Noto Sans SC, sans-serif" fill="#253143" font-weight="600">适宜时间范围内吗</text>
<rect x="80.0" y="1318.0" width="180" height="84" rx="22" fill="url(#cardFill)" stroke="#d7c4b2" stroke-width="2" filter="url(#softShadow)"/>
<text x="170.0" y="1360" text-anchor="middle" dominant-baseline="middle" font-size="18" font-family="Microsoft YaHei UI, Noto Sans SC, sans-serif" fill="#253143" font-weight="600">不能选这个时间</text>
<rect x="324.0" y="1318.0" width="180" height="84" rx="22" fill="url(#cardFill)" stroke="#d7c4b2" stroke-width="2" filter="url(#softShadow)"/>
<text x="414.0" y="1360" text-anchor="middle" dominant-baseline="middle" font-size="18" font-family="Microsoft YaHei UI, Noto Sans SC, sans-serif" fill="#253143" font-weight="600">提交成功</text>
</svg>