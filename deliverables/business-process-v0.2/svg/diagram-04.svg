<svg xmlns="http://www.w3.org/2000/svg" width="734" height="1482" viewBox="0 0 734 1482">

    <defs>
      <linearGradient id="cardFill" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fffaf4"/>
        <stop offset="100%" stop-color="#f7efe5"/>
      </linearGradient>
      <linearGradient id="diamondFill" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#f5ede4"/>
        <stop offset="100%" stop-color="#f0dfd0"/>
      </linearGradient>
      <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
        <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#253143" flood-opacity="0.14"/>
      </filter>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c4f3f"/>
      </marker>
    </defs>
    
<rect width="734" height="1482" rx="30" fill="#fcf7f1"/>
<text x="367.0" y="44" text-anchor="middle" font-size="22" font-family="Microsoft YaHei UI, Noto Sans SC, sans-serif" fill="#253143" font-weight="700">意向提交规则</text>
<path d="M 178.0 122.0 C 178.0 237.0, 170.0 237.0, 170.0 352.0" fill="none" stroke="#7c4f3f" stroke-width="3.5" marker-end="url(#arrow)" stroke-linecap="round"/>
<path d="M 170.0 448.0 C 170.0 563.0, 170.0 563.0, 170.0 678.0" fill="none" stroke="#7c4f3f" stroke-width="3.5" marker-end="url(#arrow)" stroke-linecap="round"/>
